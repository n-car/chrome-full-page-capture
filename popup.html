<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Full Page Capture</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app" id="app" data-busy="false">
      <header class="app-header">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M7 3.75H4.75a1 1 0 0 0-1 1V7M17 3.75h2.25a1 1 0 0 1 1 1V7M7 20.25H4.75a1 1 0 0 1-1-1V17M17 20.25h2.25a1 1 0 0 0 1-1V17"/>
            <rect x="7.25" y="6.75" width="9.5" height="10.5" rx="1.25"/>
            <path d="M9.75 10h4.5M9.75 13h4.5"/>
          </svg>
        </span>
        <div>
          <h1>Full Page Capture</h1>
          <p>Pixel-accurate page screenshots</p>
        </div>
      </header>

      <section class="panel primary-actions" aria-labelledby="quick-capture-heading">
        <h2 class="section-label" id="quick-capture-heading">Quick capture</h2>
        <button class="button button-primary" type="button" data-mode="full-page" data-capture-control>
          <span>Capture Full Page</span>
          <span class="action-tag" aria-hidden="true">FULL</span>
        </button>
        <button class="button button-secondary" type="button" data-mode="viewport" data-capture-control>
          <span>Capture Viewport</span>
          <span class="action-tag" aria-hidden="true">VIEW</span>
        </button>
      </section>

      <section class="panel" aria-labelledby="responsive-heading">
        <div class="section-heading">
          <h2 id="responsive-heading">Responsive</h2>
          <span>Full page</span>
        </div>

        <div class="preset-group" role="group" aria-labelledby="desktop-label">
          <div class="preset-label" id="desktop-label">
            <span>Desktop</span>
            <span class="preset-rule" aria-hidden="true"></span>
          </div>
          <div class="preset-grid">
            <button class="preset-button" type="button" data-mode="responsive" data-width="1440" data-capture-control>
              <span class="preset-value">1440</span>
              <span class="preset-unit">px</span>
            </button>
            <button class="preset-button" type="button" data-mode="responsive" data-width="1280" data-capture-control>
              <span class="preset-value">1280</span>
              <span class="preset-unit">px</span>
            </button>
          </div>
        </div>

        <div class="preset-group" role="group" aria-labelledby="mobile-label">
          <div class="preset-label" id="mobile-label">
            <span>Mobile</span>
            <span class="preset-rule" aria-hidden="true"></span>
          </div>
          <div class="preset-grid">
            <button class="preset-button" type="button" data-mode="responsive" data-width="390" data-capture-control>
              <span class="preset-value">390</span>
              <span class="preset-unit">px</span>
            </button>
            <button class="preset-button" type="button" data-mode="responsive" data-width="430" data-capture-control>
              <span class="preset-value">430</span>
              <span class="preset-unit">px</span>
            </button>
          </div>
        </div>

        <form class="custom-width" id="custom-width-form" novalidate>
          <label for="custom-width">Custom width</label>
          <div class="custom-row">
            <div class="input-shell">
              <input
                id="custom-width"
                name="width"
                type="number"
                inputmode="numeric"
                min="320"
                max="7680"
                step="1"
                value="1600"
                aria-describedby="width-hint width-error"
                data-capture-control
              >
              <span aria-hidden="true">px</span>
            </div>
            <button class="button button-compact" type="submit" data-capture-control>Capture</button>
          </div>
          <span class="field-hint" id="width-hint">320–7680 px</span>
          <span class="field-error" id="width-error" hidden>Enter a whole number from 320 to 7680.</span>
        </form>

        <button class="set-button" type="button" data-mode="set" data-capture-control>
          <span class="set-icon" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </span>
          <span>
            <strong>Capture responsive set</strong>
            <small>1440 · 1280 · 390 · 430</small>
          </span>
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="m6 3 5 5-5 5"/>
          </svg>
        </button>
      </section>

      <section class="panel options" aria-labelledby="options-heading">
        <h2 class="section-label" id="options-heading">Page preparation</h2>
        <label class="option-row">
          <span>
            <strong>Hide scrollbars</strong>
            <small>Remove scrollbars from the capture</small>
          </span>
          <span class="switch">
            <input id="hide-scrollbars" type="checkbox" checked data-capture-control>
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>
        <label class="option-row">
          <span>
            <strong>Disable animations</strong>
            <small>Pause motion and smooth scrolling</small>
          </span>
          <span class="switch">
            <input id="disable-animations" type="checkbox" checked data-capture-control>
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>
      </section>

      <footer class="status-bar" id="status-bar" data-tone="neutral">
        <span class="status-indicator" aria-hidden="true">
          <span class="status-spinner"></span>
        </span>
        <div class="status-copy">
          <span class="status-label">Status</span>
          <p id="status-message" role="status" aria-live="polite" aria-atomic="true">Ready</p>
        </div>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
